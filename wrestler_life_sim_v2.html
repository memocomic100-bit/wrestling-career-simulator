<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wrestling Career Simulator 2.0</title>
<style>
body{background:#111;color:#eee;font-family:Tahoma;margin:0}
header{background:#a00;padding:15px;text-align:center;font-size:28px;font-weight:bold}
.wrap{max-width:1200px;margin:auto;padding:15px}
.card{background:#1d1d1d;border-radius:10px;padding:12px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
button{padding:8px 10px;border:none;border-radius:8px;cursor:pointer}
.log{height:260px;overflow:auto;background:#000;padding:10px}
</style>
</head>
<body>
<header>Wrestling Career Simulator 2.0</header>
<div class="wrap">
<div id="start" class="card">
<h2>إنشاء المصارع</h2>
<input id="name" placeholder="اسم المصارع">
<select id="align">
<option value="face">Face 😇</option>
<option value="heel">Heel 😈</option>
</select>
<button onclick="newGame()">ابدأ</button>
</div>

<div id="game" style="display:none">
<div class="grid">
<div class="card"><h3>الإحصائيات</h3><div id="stats"></div></div>

<div class="card">
<h3>أنشطة</h3>
<button onclick="act('strength')">قوة</button>
<button onclick="act('skill')">مهارة</button>
<button onclick="act('fitness')">لياقة</button>
<button onclick="act('promo')">برومو</button>
<button onclick="act('rest')">راحة</button>
<button onclick="fight()">مباراة</button>
<button onclick="nextWeek()">الأسبوع التالي</button>
</div>

<div class="card">
<h3>المتجر</h3>
<button onclick="buyCoach()">مدرب (1000$)</button>
<button onclick="buyDoctor()">طبيب (1500$)</button>
<button onclick="buyGear()">معدات (750$)</button>
</div>
</div>

<div class="card"><h3>الأحداث</h3><div id="log" class="log"></div></div>
</div>
</div>

<script>
let p=null;

const rivals=["Shadow","Titan","Viper","Crusher","Hunter","Chaos"];
const feds=[
["مستقل",0],["محلي",15],["وطني",35],["عالمي",60],["أسطوري",90]
];

function r(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function addLog(t){document.getElementById("log").innerHTML="<div>"+t+"</div>"+document.getElementById("log").innerHTML;}

function newGame(){
p={
name:document.getElementById("name").value||"Rookie",
align:document.getElementById("align").value,
energy:100,money:500,fame:0,pop:10,
str:40,skill:40,fit:40,health:100,
wins:0,loss:0,titles:0,week:1,
rival:rivals[r(0,rivals.length-1)],
coach:false,doctor:false,gear:false
};
save();
show();
}

function show(){
document.getElementById("start").style.display="none";
document.getElementById("game").style.display="block";

let fed="مستقل";
for(let f of feds){if(p.fame>=f[1]) fed=f[0];}

document.getElementById("stats").innerHTML=`
<b>${p.name}</b><br>
الاتحاد: ${fed}<br>
الطاقة: ${p.energy}<br>
الصحة: ${p.health}<br>
المال: $${p.money}<br>
الشهرة: ${p.fame}<br>
الشعبية: ${p.pop}<br>
القوة: ${p.str}<br>
المهارة: ${p.skill}<br>
اللياقة: ${p.fit}<br>
الألقاب: ${p.titles}<br>
فوز: ${p.wins} | خسارة: ${p.loss}<br>
العدو الحالي: ${p.rival}
`;
}

function act(t){
if(p.energy<=0)return;

if(t=="strength"){p.energy-=15;p.str+=r(1,3);}
if(t=="skill"){p.energy-=15;p.skill+=r(1,3);}
if(t=="fitness"){p.energy-=10;p.fit+=r(1,2);}
if(t=="promo"){
p.energy-=10;
p.fame+=r(1,4);
p.pop+=(p.align=="face"?3:1);
}
if(t=="rest"){
p.energy-=5;
p.health=Math.min(100,p.health+10);
}
show();save();
}

function fight(){
if(p.energy<20)return;
p.energy-=20;

let power=(p.str+p.skill+p.fit)/3+r(0,20);
let enemy=r(40,120);

if(power>enemy){
p.wins++;
p.money+=r(500,3000);
p.fame+=r(2,6);
p.pop+=2;

if(r(1,100)>90){
p.titles++;
addLog("🏆 فزت بلقب!");
}

addLog("✅ فزت على "+p.rival);
}else{
p.loss++;
p.pop=Math.max(0,p.pop-1);
addLog("❌ خسرت أمام "+p.rival);
}

if(r(1,100)>92){
p.health-=r(10,25);
addLog("🤕 إصابة أثناء المباراة");
}

show();save();
}

function nextWeek(){
p.week++;
p.energy=100;

let e=r(1,100);

if(e>90){p.money+=5000;addLog("📺 عرض تلفزيوني ضخم");}
else if(e>80){p.fame+=10;addLog("🔥 ترند على السوشيال ميديا");}
else if(e>70){p.health-=15;addLog("🚑 إصابة خارج الحلبة");}
else if(e>60){p.money+=p.pop*10;addLog("👕 مبيعات قمصان");}

if(p.doctor && p.health<100)p.health+=10;

if(p.fame>=100 && p.titles>=5){
addLog("🌟 أصبحت مرشحًا لـ Hall Of Fame");
}

show();save();
}

function buyCoach(){
if(p.money>=1000&&!p.coach){p.money-=1000;p.coach=true;p.str+=5;p.skill+=5;}
show();save();
}
function buyDoctor(){
if(p.money>=1500&&!p.doctor){p.money-=1500;p.doctor=true;}
show();save();
}
function buyGear(){
if(p.money>=750&&!p.gear){p.money-=750;p.gear=true;p.fit+=10;}
show();save();
}

function save(){localStorage.setItem("wcs2",JSON.stringify(p));}
function load(){
let s=localStorage.getItem("wcs2");
if(s){p=JSON.parse(s);show();}
}
load();
</script>
</body>
</html>
